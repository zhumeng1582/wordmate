<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>单词共学管理后台</title><link rel="stylesheet" href="/style.css"></head><body><header><div><strong>单词共学</strong><span>管理后台</span></div><p>仅限授权管理员使用</p></header><main><nav aria-label="管理模块"><button data-page="feedback">反馈管理</button><button data-page="users">用户</button><button data-page="books">单词库</button><button data-page="usage">AI 用量</button></nav><section><div class="heading"><div><h1 id="title"></h1><p id="description"></p></div><button id="refresh" class="secondary">刷新</button></div><div id="filters"></div><div id="notice" role="status"></div><div id="content"></div><div class="pagination"><button id="previous" class="secondary">上一页</button><span id="page-number"></span><button id="next" class="secondary">下一页</button></div></section></main><dialog id="dialog"><form method="dialog"><h2>处理反馈</h2><p id="dialog-context"></p><div id="repair"></div><div id="repair-notice" role="status"></div><label>处理状态<select id="status"><option value="pending">待处理</option><option value="in_progress">处理中</option><option value="resolved">已解决</option><option value="dismissed">无需处理</option></select></label><label>处理备注<textarea id="note" maxlength="500" rows="4" placeholder="填写处理结果，避免记录个人信息"></textarea></label><p class="hint">仅记录处理状态，内容不会自动修改。</p><div class="actions"><button value="cancel" class="secondary">取消</button><button id="save" value="default">保存</button></div></form></dialog><script src="/app.js"></script></body></html>
