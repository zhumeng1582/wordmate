services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: wordmate
      POSTGRES_USER: wordmate
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your shell}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U wordmate -d wordmate']
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  pgdata:
