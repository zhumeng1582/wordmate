<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="600" viewBox="0 0 1100 600"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#55785e"/></marker></defs><rect width="1100" height="600" rx="20" fill="#edf2e8"/><style>text{font-family:PingFang SC,sans-serif;fill:#203e34}.small{font-size:14px}.title{font-size:20px;font-weight:600}</style><text x="35" y="45" class="title">词伴 0.1 / 模块化单体与可恢复任务</text><rect x="35" y="100" width="260" height="125" rx="15" fill="white" stroke="#ceddc7"/><text x="53" y="135" class="title">微信小程序</text><text x="53" y="162" class="small">Taro · React · TypeScript</text><text x="53" y="184" class="small">页面 / 录词 / 复习 / 月测</text><rect x="385" y="100" width="310" height="150" rx="15" fill="white" stroke="#ceddc7"/><text x="403" y="135" class="title">NestJS API</text><text x="403" y="162" class="small">鉴权 → 家庭归属 → 角色 → 租约</text><text x="403" y="184" class="small">模块服务 / 数据库事务 / 安全DTO</text><text x="403" y="206" class="small">秘密凭证只在服务端</text><rect x="790" y="100" width="270" height="150" rx="15" fill="white" stroke="#ceddc7"/><text x="808" y="135" class="title">PostgreSQL</text><text x="808" y="162" class="small">29张表 / 事实与一致性</text><text x="808" y="184" class="small">学习、月测、错误、权限</text><text x="808" y="206" class="small">生成任务 / 独立删除清单</text><rect x="385" y="345" width="310" height="150" rx="15" fill="white" stroke="#ceddc7"/><text x="403" y="380" class="title">Worker + Dispatcher</text><text x="403" y="407" class="small">从PG领取与租约确认</text><text x="403" y="429" class="small">AI / 音频 / 导出 / 月测准备</text><text x="403" y="451" class="small">结果提交前重新校验状态</text><rect x="790" y="345" width="270" height="125" rx="15" fill="white" stroke="#ceddc7"/><text x="808" y="380" class="title">Redis / BullMQ</text><text x="808" y="407" class="small">任务唤醒 / 限流 / 公共词缓存</text><text x="808" y="429" class="small">丢失可从PG重新投递</text><rect x="35" y="345" width="260" height="150" rx="15" fill="white" stroke="#ceddc7"/><text x="53" y="380" class="title">外部服务 / 私有对象</text><text x="53" y="407" class="small">词典 · OpenAI/千问 · CosyVoice</text><text x="53" y="429" class="small">COS音频与导出</text><text x="53" y="451" class="small">不传家长身份或孩子姓名</text><polyline points="295,165 385,165" fill="none" stroke="#55785e" stroke-width="2" marker-end="url(#a)"/><text x="310" y="148" class="small">HTTPS</text><polyline points="695,175 790,175" fill="none" stroke="#55785e" stroke-width="2" marker-end="url(#a)"/><text x="720" y="160" class="small">事务</text><polyline points="540,345 540,250" fill="none" stroke="#55785e" stroke-width="2" marker-end="url(#a)"/><text x="552" y="302" class="small">读写任务结果</text><polyline points="790,400 695,400" fill="none" stroke="#55785e" stroke-width="2" marker-end="url(#a)"/><text x="705" y="385" class="small">投递/消费</text><polyline points="385,415 295,415" fill="none" stroke="#55785e" stroke-width="2" marker-end="url(#a)"/><text x="300" y="398" class="small">最少上下文</text><polyline points="925,250 925,345" fill="none" stroke="#55785e" stroke-width="2" marker-end="url(#a)"/><text x="938" y="300" class="small">任务恢复投递</text><text x="35" y="555" class="small">所有私有资源先授权；客户端不直连数据库或供应商。月测交卷与错题归集为同一数据库事务。</text></svg>