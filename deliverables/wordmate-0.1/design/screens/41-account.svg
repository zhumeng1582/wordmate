<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844"><title>管理自己的账号</title><style>text{font-family:"PingFang SC","Noto Sans CJK SC",sans-serif} .small{font-size:12px;fill:#67796e} .body{font-size:14px;fill:#3b5147}</style><rect width="390" height="844" rx="30" fill="#f7f8f2"/><text x="24" y="30" font-size="12" fill="#203e34">9:41</text><text x="304" y="30" font-size="13" fill="#203e34">•••　◉</text><text x="24" y="73" font-size="15" fill="#255d48">词伴</text><text x="24" y="111" class="small">爸爸 · 当前家庭管理员</text><text x="24" y="151" font-size="25" font-weight="600" fill="#203e34">管理自己的账号</text><rect x="24" y="177" width="342" height="73" rx="16" fill="#ffffff"/><text x="40" y="205" font-size="17" font-weight="600" fill="#203e34">退出登录</text><text x="40" y="230" font-size="13" fill="#203e34" opacity="0.85">仅退出当前设备，不删除记录。</text><rect x="24" y="262" width="342" height="73" rx="16" fill="#ffffff"/><text x="40" y="290" font-size="17" font-weight="600" fill="#203e34">转交管理员 / 退出家庭</text><text x="40" y="315" font-size="13" fill="#203e34" opacity="0.85">退出前先将管理员交给有效成员。</text><rect x="24" y="347" width="342" height="73" rx="16" fill="#ffffff"/><text x="40" y="375" font-size="17" font-weight="600" fill="#203e34">完整孩子数据导出</text><text x="40" y="400" font-size="13" fill="#203e34" opacity="0.85">仅管理员 · JSON · 24小时有效</text><rect x="24" y="432" width="342" height="73" rx="16" fill="#ffffff"/><text x="40" y="460" font-size="17" font-weight="600" fill="#203e34">注销自己的账号</text><text x="40" y="485" font-size="13" fill="#203e34" opacity="0.85">先转交或解散自己管理的家庭。</text><rect x="24" y="706" width="342" height="48" rx="13" fill="#255d48"/><text x="195" y="736" text-anchor="middle" font-size="14" fill="white">返回我的家庭</text><text x="75" y="780" text-anchor="middle" font-size="12" fill="#527563">解散家庭</text><text x="195" y="780" text-anchor="middle" font-size="12" fill="#527563">删除孩子</text><path d="M24 797H366" stroke="#dae3d8"/><text x="56" y="825" text-anchor="middle" font-size="12" fill="#8b948d">今日</text><text x="149" y="825" text-anchor="middle" font-size="12" fill="#8b948d">单词本</text><text x="242" y="825" text-anchor="middle" font-size="12" fill="#8b948d">日历</text><text x="335" y="825" text-anchor="middle" font-size="12" fill="#255d48">我的</text></svg>