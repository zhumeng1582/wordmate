<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844"><title>在句子中查词</title><style>text{font-family:"PingFang SC","Noto Sans CJK SC",sans-serif} .small{font-size:12px;fill:#67796e} .body{font-size:14px;fill:#3b5147}</style><rect width="390" height="844" rx="30" fill="#f7f8f2"/><text x="24" y="30" font-size="12" fill="#203e34">9:41</text><text x="304" y="30" font-size="13" fill="#203e34">•••　◉</text><text x="24" y="73" font-size="15" fill="#255d48">词伴</text><text x="24" y="111" class="small">点词弹层 · 可选择相邻词查询短语</text><text x="24" y="151" font-size="25" font-weight="600" fill="#203e34">在句子中查词</text><rect x="24" y="177" width="342" height="94" rx="16" fill="#ffffff"/><text x="40" y="205" font-size="17" font-weight="600" fill="#203e34">原句</text><text x="40" y="230" font-size="13" fill="#203e34" opacity="0.85">Our luggage arrived at the airport after a</text><text x="40" y="251" font-size="13" fill="#203e34" opacity="0.85">short delay.</text><rect x="24" y="283" width="342" height="94" rx="16" fill="#255d48"/><text x="40" y="311" font-size="17" font-weight="600" fill="#ffffff">luggage</text><text x="40" y="336" font-size="13" fill="#ffffff" opacity="0.85">n. 行李（不可数）</text><text x="40" y="357" font-size="13" fill="#ffffff" opacity="0.85">▶ 英音　▶ 美音</text><rect x="24" y="389" width="342" height="73" rx="16" fill="#e8f1e4"/><text x="40" y="417" font-size="17" font-weight="600" fill="#203e34">已有义项</text><text x="40" y="442" font-size="13" fill="#203e34" opacity="0.85">已在旅行小词本 · 收藏 ☆</text><rect x="24" y="474" width="342" height="73" rx="16" fill="#ffffff"/><text x="40" y="502" font-size="17" font-weight="600" fill="#203e34">词义选择</text><text x="40" y="527" font-size="13" fill="#203e34" opacity="0.85">词典来源及音标展示；上下文建议仅供参考。</text><rect x="24" y="706" width="342" height="48" rx="13" fill="#255d48"/><text x="195" y="736" text-anchor="middle" font-size="14" fill="white">收起，继续阅读</text><text x="75" y="780" text-anchor="middle" font-size="12" fill="#527563">添加其他义项</text><path d="M24 797H366" stroke="#dae3d8"/><text x="56" y="825" text-anchor="middle" font-size="12" fill="#8b948d">今日</text><text x="149" y="825" text-anchor="middle" font-size="12" fill="#255d48">单词本</text><text x="242" y="825" text-anchor="middle" font-size="12" fill="#8b948d">日历</text><text x="335" y="825" text-anchor="middle" font-size="12" fill="#8b948d">我的</text></svg>