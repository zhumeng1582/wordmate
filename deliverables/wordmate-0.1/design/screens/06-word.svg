<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844"><title>luggage</title><style>text{font-family:"PingFang SC","Noto Sans CJK SC",sans-serif} .small{font-size:12px;fill:#67796e} .body{font-size:14px;fill:#3b5147}</style><rect width="390" height="844" rx="30" fill="#f7f8f2"/><text x="24" y="30" font-size="12" fill="#203e34">9:41</text><text x="304" y="30" font-size="13" fill="#203e34">•••　◉</text><text x="24" y="73" font-size="15" fill="#255d48">词伴</text><text x="24" y="111" class="small">/ˈlʌɡɪdʒ/　n. 行李</text><text x="24" y="151" font-size="25" font-weight="600" fill="#203e34">luggage</text><rect x="24" y="177" width="342" height="73" rx="16" fill="#e8f1e4"/><text x="40" y="205" font-size="17" font-weight="600" fill="#203e34">▶ 美音 · 女声A</text><text x="40" y="230" font-size="13" fill="#203e34" opacity="0.85">切换：英音 / 美音　 正常 / 慢速</text><rect x="24" y="262" width="342" height="94" rx="16" fill="#ffffff"/><text x="40" y="290" font-size="17" font-weight="600" fill="#203e34">在句子里理解</text><text x="40" y="315" font-size="13" fill="#203e34" opacity="0.85">Our luggage arrived at the airport after a</text><text x="40" y="336" font-size="13" fill="#203e34" opacity="0.85">short delay.</text><rect x="24" y="368" width="342" height="73" rx="16" fill="#ffffff"/><text x="40" y="396" font-size="17" font-weight="600" fill="#203e34">词条标注</text><text x="40" y="421" font-size="13" fill="#203e34" opacity="0.85">简单　易错 ✓　收藏 ☆　待纠错</text><rect x="24" y="453" width="342" height="73" rx="16" fill="#ffffff"/><text x="40" y="481" font-size="17" font-weight="600" fill="#203e34">历史错误 3 次</text><text x="40" y="506" font-size="13" fill="#203e34" opacity="0.85">最近一次：10月16日 · 月测</text><rect x="24" y="706" width="342" height="48" rx="13" fill="#255d48"/><text x="195" y="736" text-anchor="middle" font-size="14" fill="white">复习这个词</text><text x="75" y="780" text-anchor="middle" font-size="12" fill="#527563">换一句</text><text x="195" y="780" text-anchor="middle" font-size="12" fill="#527563">提交纠错</text><path d="M24 797H366" stroke="#dae3d8"/><text x="56" y="825" text-anchor="middle" font-size="12" fill="#8b948d">今日</text><text x="149" y="825" text-anchor="middle" font-size="12" fill="#255d48">单词本</text><text x="242" y="825" text-anchor="middle" font-size="12" fill="#8b948d">日历</text><text x="335" y="825" text-anchor="middle" font-size="12" fill="#8b948d">我的</text></svg>