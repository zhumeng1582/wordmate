<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844"><title>把今天的坚持留下来</title><style>text{font-family:"PingFang SC","Noto Sans CJK SC",sans-serif} .small{font-size:12px;fill:#67796e} .body{font-size:14px;fill:#3b5147}</style><rect width="390" height="844" rx="30" fill="#f7f8f2"/><text x="24" y="30" font-size="12" fill="#203e34">9:41</text><text x="304" y="30" font-size="13" fill="#203e34">•••　◉</text><text x="24" y="73" font-size="15" fill="#255d48">词伴</text><text x="24" y="111" class="small">分享预览 · 默认隐藏昵称</text><text x="24" y="151" font-size="25" font-weight="600" fill="#203e34">把今天的坚持留下来</text><rect x="24" y="177" width="342" height="73" rx="16" fill="#255d48"/><text x="40" y="205" font-size="17" font-weight="600" fill="#ffffff">今日学习 10 词</text><text x="40" y="230" font-size="13" fill="#ffffff" opacity="0.85">连续5天 · 今天也在慢慢进步</text><rect x="24" y="262" width="342" height="73" rx="16" fill="#ffffff"/><text x="40" y="290" font-size="17" font-weight="600" fill="#203e34">显示孩子昵称：关闭</text><text x="40" y="315" font-size="13" fill="#203e34" opacity="0.85">预览不含家长身份、错题或家庭邀请。</text><rect x="24" y="347" width="342" height="73" rx="16" fill="#ffffff"/><text x="40" y="375" font-size="17" font-weight="600" fill="#203e34">由你决定分享给谁</text><text x="40" y="400" font-size="13" fill="#203e34" opacity="0.85">保存图片后可自行分享；分享不开放学习档案。</text><rect x="24" y="706" width="342" height="48" rx="13" fill="#255d48"/><text x="195" y="736" text-anchor="middle" font-size="14" fill="white">保存海报（演示）</text><path d="M24 797H366" stroke="#dae3d8"/><text x="56" y="825" text-anchor="middle" font-size="12" fill="#255d48">今日</text><text x="149" y="825" text-anchor="middle" font-size="12" fill="#8b948d">单词本</text><text x="242" y="825" text-anchor="middle" font-size="12" fill="#8b948d">日历</text><text x="335" y="825" text-anchor="middle" font-size="12" fill="#8b948d">我的</text></svg>