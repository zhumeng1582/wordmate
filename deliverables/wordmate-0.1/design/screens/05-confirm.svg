<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844"><title>选对意思，再开始</title><style>text{font-family:"PingFang SC","Noto Sans CJK SC",sans-serif} .small{font-size:12px;fill:#67796e} .body{font-size:14px;fill:#3b5147}</style><rect width="390" height="844" rx="30" fill="#f7f8f2"/><text x="24" y="30" font-size="12" fill="#203e34">9:41</text><text x="304" y="30" font-size="13" fill="#203e34">•••　◉</text><text x="24" y="73" font-size="15" fill="#255d48">词伴</text><text x="24" y="111" class="small">识别3项 · 重复项沿用已有学习进度</text><text x="24" y="151" font-size="25" font-weight="600" fill="#203e34">选对意思，再开始</text><rect x="24" y="177" width="342" height="73" rx="16" fill="#e8f1e4"/><text x="40" y="205" font-size="17" font-weight="600" fill="#203e34">airport</text><text x="40" y="230" font-size="13" fill="#203e34" opacity="0.85">✓ 名词 · 机场</text><rect x="24" y="262" width="342" height="73" rx="16" fill="#ffffff"/><text x="40" y="290" font-size="17" font-weight="600" fill="#203e34">luggage</text><text x="40" y="315" font-size="13" fill="#203e34" opacity="0.85">✓ 名词 · 行李（不可数）</text><rect x="24" y="347" width="342" height="94" rx="16" fill="#ffffff"/><text x="40" y="375" font-size="17" font-weight="600" fill="#203e34">delay</text><text x="40" y="400" font-size="13" fill="#203e34" opacity="0.85">● 名词 · 延迟</text><text x="40" y="421" font-size="13" fill="#203e34" opacity="0.85">○ 动词 · 推迟</text><rect x="24" y="453" width="342" height="73" rx="16" fill="#ffffff"/><text x="40" y="481" font-size="17" font-weight="600" fill="#203e34">单词先保存，例句随后生成</text><text x="40" y="506" font-size="13" fill="#203e34" opacity="0.85">如个别条目无结果，可修改后重试。</text><rect x="24" y="706" width="342" height="48" rx="13" fill="#255d48"/><text x="195" y="736" text-anchor="middle" font-size="14" fill="white">保存并生成关联例句</text><path d="M24 797H366" stroke="#dae3d8"/><text x="56" y="825" text-anchor="middle" font-size="12" fill="#8b948d">今日</text><text x="149" y="825" text-anchor="middle" font-size="12" fill="#255d48">单词本</text><text x="242" y="825" text-anchor="middle" font-size="12" fill="#8b948d">日历</text><text x="335" y="825" text-anchor="middle" font-size="12" fill="#8b948d">我的</text></svg>