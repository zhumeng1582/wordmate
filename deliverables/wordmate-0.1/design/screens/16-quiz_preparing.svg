<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844"><title>正在准备题目</title><style>text{font-family:"PingFang SC","Noto Sans CJK SC",sans-serif} .small{font-size:12px;fill:#67796e} .body{font-size:14px;fill:#3b5147}</style><rect width="390" height="844" rx="30" fill="#f7f8f2"/><text x="24" y="30" font-size="12" fill="#203e34">9:41</text><text x="304" y="30" font-size="13" fill="#203e34">•••　◉</text><text x="24" y="73" font-size="15" fill="#255d48">词伴</text><text x="24" y="111" class="small">本次题目和顺序将在开始后固定</text><text x="24" y="151" font-size="25" font-weight="600" fill="#203e34">正在准备题目</text><rect x="24" y="177" width="342" height="73" rx="16" fill="#255d48"/><text x="40" y="205" font-size="17" font-weight="600" fill="#ffffff">准备中 · 12 / 20</text><text x="40" y="230" font-size="13" fill="#ffffff" opacity="0.85">正在检查选项与词义，稍等一下。</text><rect x="24" y="262" width="342" height="73" rx="16" fill="#ffffff"/><text x="40" y="290" font-size="17" font-weight="600" fill="#203e34">生成失败也不会丢失词库</text><text x="40" y="315" font-size="13" fill="#203e34" opacity="0.85">可重试或放弃；不生成不完整试卷。</text><rect x="24" y="706" width="342" height="48" rx="13" fill="#255d48"/><text x="195" y="736" text-anchor="middle" font-size="14" fill="white">预览准备完成状态</text><text x="75" y="780" text-anchor="middle" font-size="12" fill="#527563">返回日历</text><path d="M24 797H366" stroke="#dae3d8"/><text x="56" y="825" text-anchor="middle" font-size="12" fill="#8b948d">今日</text><text x="149" y="825" text-anchor="middle" font-size="12" fill="#8b948d">单词本</text><text x="242" y="825" text-anchor="middle" font-size="12" fill="#255d48">日历</text><text x="335" y="825" text-anchor="middle" font-size="12" fill="#8b948d">我的</text></svg>