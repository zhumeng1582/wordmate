<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844"><title>查一个词</title><style>text{font-family:"PingFang SC","Noto Sans CJK SC",sans-serif} .small{font-size:12px;fill:#67796e} .body{font-size:14px;fill:#3b5147}</style><rect width="390" height="844" rx="30" fill="#f7f8f2"/><text x="24" y="30" font-size="12" fill="#203e34">9:41</text><text x="304" y="30" font-size="13" fill="#203e34">•••　◉</text><text x="24" y="73" font-size="15" fill="#255d48">词伴</text><text x="24" y="111" class="small">查我的单词本 / 查词典</text><text x="24" y="151" font-size="25" font-weight="600" fill="#203e34">查一个词</text><rect x="24" y="177" width="342" height="73" rx="16" fill="#e8f1e4"/><text x="40" y="205" font-size="17" font-weight="600" fill="#203e34">⌕ luggage</text><text x="40" y="230" font-size="13" fill="#203e34" opacity="0.85">支持英文或中文查询</text><rect x="24" y="262" width="342" height="73" rx="16" fill="#e8f1e4"/><text x="40" y="290" font-size="17" font-weight="600" fill="#203e34">我的单词本 · 1条</text><text x="40" y="315" font-size="13" fill="#203e34" opacity="0.85">luggage　n. 行李</text><rect x="24" y="347" width="342" height="73" rx="16" fill="#ffffff"/><text x="40" y="375" font-size="17" font-weight="600" fill="#203e34">词典结果</text><text x="40" y="400" font-size="13" fill="#203e34" opacity="0.85">查到词形与多种词义，选择后添加。</text><rect x="24" y="706" width="342" height="48" rx="13" fill="#255d48"/><text x="195" y="736" text-anchor="middle" font-size="14" fill="white">查看词典释义</text><path d="M24 797H366" stroke="#dae3d8"/><text x="56" y="825" text-anchor="middle" font-size="12" fill="#8b948d">今日</text><text x="149" y="825" text-anchor="middle" font-size="12" fill="#255d48">单词本</text><text x="242" y="825" text-anchor="middle" font-size="12" fill="#8b948d">日历</text><text x="335" y="825" text-anchor="middle" font-size="12" fill="#8b948d">我的</text></svg>