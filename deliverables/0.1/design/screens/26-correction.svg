<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844"><title>让词条更准确</title><style>text{font-family:"PingFang SC","Noto Sans CJK SC",sans-serif} .small{font-size:12px;fill:#67796e} .body{font-size:14px;fill:#3b5147}</style><rect width="390" height="844" rx="30" fill="#f7f8f2"/><text x="24" y="30" font-size="12" fill="#203e34">9:41</text><text x="304" y="30" font-size="13" fill="#203e34">•••　◉</text><text x="24" y="73" font-size="15" fill="#255d48">词伴</text><text x="24" y="111" class="small">luggage · 词义版本2</text><text x="24" y="151" font-size="25" font-weight="600" fill="#203e34">让词条更准确</text><rect x="24" y="177" width="342" height="73" rx="16" fill="#ffffff"/><text x="40" y="205" font-size="17" font-weight="600" fill="#203e34">问题类型</text><text x="40" y="230" font-size="13" fill="#203e34" opacity="0.85">释义 ✓　音标　例句　拼写　其他</text><rect x="24" y="262" width="342" height="73" rx="16" fill="#ffffff"/><text x="40" y="290" font-size="17" font-weight="600" fill="#203e34">当前内容</text><text x="40" y="315" font-size="13" fill="#203e34" opacity="0.85">n. 行李</text><rect x="24" y="347" width="342" height="73" rx="16" fill="#ffffff"/><text x="40" y="375" font-size="17" font-weight="600" fill="#203e34">建议修正</text><text x="40" y="400" font-size="13" fill="#203e34" opacity="0.85">补充：行李通常作不可数名词。</text><rect x="24" y="432" width="342" height="73" rx="16" fill="#ffffff"/><text x="40" y="460" font-size="17" font-weight="600" fill="#203e34">提交后由家庭管理员处理</text><text x="40" y="485" font-size="13" fill="#203e34" opacity="0.85">词义身份改变时重新添加，不转移旧历史。</text><rect x="24" y="706" width="342" height="48" rx="13" fill="#255d48"/><text x="195" y="736" text-anchor="middle" font-size="14" fill="white">提交纠错建议</text><path d="M24 797H366" stroke="#dae3d8"/><text x="56" y="825" text-anchor="middle" font-size="12" fill="#8b948d">今日</text><text x="149" y="825" text-anchor="middle" font-size="12" fill="#255d48">单词本</text><text x="242" y="825" text-anchor="middle" font-size="12" fill="#8b948d">日历</text><text x="335" y="825" text-anchor="middle" font-size="12" fill="#8b948d">我的</text></svg>