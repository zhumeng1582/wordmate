<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844"><title>找到舒服的学习节奏</title><style>text{font-family:"PingFang SC","Noto Sans CJK SC",sans-serif} .small{font-size:12px;fill:#67796e} .body{font-size:14px;fill:#3b5147}</style><rect width="390" height="844" rx="30" fill="#f7f8f2"/><text x="24" y="30" font-size="12" fill="#203e34">9:41</text><text x="304" y="30" font-size="13" fill="#203e34">•••　◉</text><text x="24" y="73" font-size="15" fill="#255d48">词伴</text><text x="24" y="111" class="small">小明的设置 · 家庭共享</text><text x="24" y="151" font-size="25" font-weight="600" fill="#203e34">找到舒服的学习节奏</text><rect x="24" y="177" width="342" height="94" rx="16" fill="#e8f1e4"/><text x="40" y="205" font-size="17" font-weight="600" fill="#203e34">口音与音色</text><text x="40" y="230" font-size="13" fill="#203e34" opacity="0.85">美音 ✓　英音　·　女声A ▾</text><text x="40" y="251" font-size="13" fill="#203e34" opacity="0.85">▶ 试听当前音色</text><rect x="24" y="283" width="342" height="73" rx="16" fill="#ffffff"/><text x="40" y="311" font-size="17" font-weight="600" fill="#203e34">语速与难度</text><text x="40" y="336" font-size="13" fill="#203e34" opacity="0.85">正常1.0x　·　英语水平A2</text><rect x="24" y="368" width="342" height="94" rx="16" fill="#ffffff"/><text x="40" y="396" font-size="17" font-weight="600" fill="#203e34">每日计划</text><text x="40" y="421" font-size="13" fill="#203e34" opacity="0.85">目标10词 · 最多10个新词</text><text x="40" y="442" font-size="13" fill="#203e34" opacity="0.85">今天已开始学习，目标调整明日生效。</text><rect x="24" y="474" width="342" height="94" rx="16" fill="#ffffff"/><text x="40" y="502" font-size="17" font-weight="600" fill="#203e34">账号与家庭</text><text x="40" y="527" font-size="13" fill="#203e34" opacity="0.85">退出登录 / 退出家庭 / 注销</text><text x="40" y="548" font-size="13" fill="#203e34" opacity="0.85">删除孩子与完整数据导出仅管理员。</text><rect x="24" y="706" width="342" height="48" rx="13" fill="#255d48"/><text x="195" y="736" text-anchor="middle" font-size="14" fill="white">保存设置</text><path d="M24 797H366" stroke="#dae3d8"/><text x="56" y="825" text-anchor="middle" font-size="12" fill="#8b948d">今日</text><text x="149" y="825" text-anchor="middle" font-size="12" fill="#8b948d">单词本</text><text x="242" y="825" text-anchor="middle" font-size="12" fill="#8b948d">日历</text><text x="335" y="825" text-anchor="middle" font-size="12" fill="#255d48">我的</text></svg>